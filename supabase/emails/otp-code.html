<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f6f7f9;margin:0;padding:0;">
  <tr>
    <td align="center" style="padding:32px 12px;">

      <table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:480px;">

        <!-- 덕목 6색 띠 -->
        <tr>
          <td align="center" style="padding:0 0 14px 0;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:0 auto;">
              <tr>
                <td width="26" height="8" style="width:26px;height:8px;background-color:#2457fc;border-radius:4px 0 0 4px;font-size:0;line-height:0;">&nbsp;</td>
                <td width="26" height="8" style="width:26px;height:8px;background-color:#cf1001;font-size:0;line-height:0;">&nbsp;</td>
                <td width="26" height="8" style="width:26px;height:8px;background-color:#f72fa7;font-size:0;line-height:0;">&nbsp;</td>
                <td width="26" height="8" style="width:26px;height:8px;background-color:#9e3bed;font-size:0;line-height:0;">&nbsp;</td>
                <td width="26" height="8" style="width:26px;height:8px;background-color:#00af50;font-size:0;line-height:0;">&nbsp;</td>
                <td width="26" height="8" style="width:26px;height:8px;background-color:#9e7108;border-radius:0 4px 4px 0;font-size:0;line-height:0;">&nbsp;</td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- 앱 이름 -->
        <tr>
          <td align="center" style="padding:0 0 20px 0;font-family:Apple SD Gothic Neo,Malgun Gothic,Helvetica Neue,Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold;color:#101114;text-align:center;">
            강점 남기기 <span style="color:#565e6b;font-weight:normal;">관리자</span>
          </td>
        </tr>

        <!-- 흰 카드 -->
        <tr>
          <td style="background-color:#ffffff;border:1px solid #d7dbe2;border-radius:16px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">

              <tr>
                <td align="center" style="padding:34px 30px 0 30px;font-family:Apple SD Gothic Neo,Malgun Gothic,Helvetica Neue,Helvetica,Arial,sans-serif;font-size:21px;font-weight:bold;color:#101114;text-align:center;line-height:1.4;">
                  로그인 번호
                </td>
              </tr>

              <tr>
                <td align="center" style="padding:10px 30px 0 30px;font-family:Apple SD Gothic Neo,Malgun Gothic,Helvetica Neue,Helvetica,Arial,sans-serif;font-size:14px;color:#565e6b;text-align:center;line-height:1.7;">
                  아래 번호를<br>로그인 화면에 입력해주세요.
                </td>
              </tr>

              <!-- 인증번호 -->
              <tr>
                <td style="padding:22px 30px 0 30px;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#eef2ff;border:1px solid #ccd9fe;border-radius:12px;">
                    <tr>
                      <td align="center" style="padding:22px 10px;font-family:Apple SD Gothic Neo,Helvetica Neue,Helvetica,Arial,sans-serif;font-size:32px;font-weight:bold;color:#2457fc;text-align:center;letter-spacing:8px;text-indent:8px;line-height:1.2;">
                        {{ .Token }}
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>

              <tr>
                <td align="center" style="padding:16px 30px 0 30px;font-family:Apple SD Gothic Neo,Malgun Gothic,Helvetica Neue,Helvetica,Arial,sans-serif;font-size:13px;color:#565e6b;text-align:center;line-height:1.7;">
                  이 번호는 <span style="color:#101114;font-weight:bold;">1시간</span> 동안만 쓸 수 있어요.<br>
                  시간이 지났다면 로그인 화면에서 다시 받으시면 돼요.
                </td>
              </tr>

              <!-- 가르는 선 -->
              <tr>
                <td style="padding:24px 30px 0 30px;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td height="1" style="height:1px;background-color:#d7dbe2;font-size:0;line-height:0;">&nbsp;</td>
                    </tr>
                  </table>
                </td>
              </tr>

              <tr>
                <td align="center" style="padding:16px 30px 30px 30px;font-family:Apple SD Gothic Neo,Malgun Gothic,Helvetica Neue,Helvetica,Arial,sans-serif;font-size:12px;color:#8a919e;text-align:center;line-height:1.7;">
                  본인이 요청한 것이 아니라면 이 메일은 무시해주세요.<br>
                  번호를 다른 사람에게 알려주지 마세요.
                </td>
              </tr>

            </table>
          </td>
        </tr>

        <!-- 꼬리말 -->
        <tr>
          <td align="center" style="padding:16px 0 0 0;font-family:Apple SD Gothic Neo,Malgun Gothic,Helvetica Neue,Helvetica,Arial,sans-serif;font-size:11px;color:#8a919e;text-align:center;line-height:1.7;">
            서로에게서 본 강점을 남기는 곳<br>
            강점 남기기 &middot; 발신 전용 메일입니다
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>
